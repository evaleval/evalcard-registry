# Multi-benchmark / multi-composite family registry. Singleton families
# default to `family.id == benchmark.id` and don't appear here — the
# producer / resolver builds them automatically when no curated entry
# covers a benchmark.
#
# Each entry's key is the family slug. Optional fields:
#   display                — human-readable family name; defaults to slug.
#   category               — single-valued category (general / agentic /
#                            reasoning / knowledge / multimodal /
#                            tool-use / math / security / factuality /
#                            reward-modelling / safety / code /
#                            instruction-following / other). Singleton
#                            families derive category from benchmark tags
#                            via the producer's categorise_benchmark_udf.
#   benchmarks             — canonical benchmark ids in this family. A
#                            benchmark may belong to at most one curated
#                            family (validated at seed time).
#   composite_keys         — composites nested under this family. Used
#                            for multi-composite families (HELM has 7).
#   primary_benchmark_key  — benchmark whose primary metric is the
#                            family's headline number. Optional.
#   folder_aliases         — EEE source_config values that should resolve
#                            into this family even when their slug
#                            doesn't naturally suggest it. Replaces the
#                            reference's EXPLICIT_FAMILY_MAP entries that
#                            aren't covered by composite curation.

mmlu:
  display: MMLU family
  category: knowledge
  benchmarks: [mmlu, mmlu-pro]

gpqa:
  display: GPQA family
  category: knowledge
  benchmarks: [gpqa, gpqa-diamond]

swe-bench:
  display: SWE-bench family
  category: agentic
  benchmarks: [swe-bench, swe-bench-verified]

bfcl:
  display: BFCL family
  category: tool-use
  benchmarks: [bfcl]

judgebench:
  display: JudgeBench family
  category: other
  benchmarks: [judgebench-coding, judgebench-knowledge]

# HELM is a multi-composite family — 7 sub-leaderboards under one brand.
# The producer's hierarchy.json builder renders this as families[helm]
# with composites[] containing helm-classic, helm-lite, etc.
helm:
  display: HELM
  category: general
  composite_keys:
    - helm-classic
    - helm-lite
    - helm-capabilities
    - helm-instruct
    - helm-mmlu
    - helm-air-bench
    - helm-safety

# HAL leaderboard groups distinct agentic benchmarks (assistantbench,
# gaia, scicode, ...) under one publishing surface. Each is its own
# canonical benchmark; the family is the brand.
hal:
  display: HAL Leaderboard
  category: agentic
  composite_keys:
    - hal
  folder_aliases:
    - hal-assistantbench
    - hal-corebench-hard
    - hal-gaia
    - hal-online-mind2web
    - hal-scicode
    - hal-scienceagentbench
    - hal-swebench-verified-mini
    - hal-taubench-airline
    - hal-usaco

# Reward-bench family — 4 reward-modelling benchmarks (the original
# RewardBench plus its variants).
reward-bench:
  display: RewardBench family
  category: reward-modelling
  benchmarks: [rewardbench, rewardbench-2, rewardbench-safety]
  folder_aliases:
    - reward-bench
    - reward-bench-2
    - rewardbench
    - rewardbench-2

# Fibble Arena — 6 versioned variants of one canonical benchmark.
# folder_aliases captures the per-version source_config strings that
# the resolver wouldn't otherwise collapse.
fibble-arena:
  display: Fibble Arena
  category: reasoning
  folder_aliases:
    - fibble_arena
    - fibble1_arena
    - fibble2_arena
    - fibble3_arena
    - fibble4_arena
    - fibble5_arena

# Tau-Bench — original + tau2 per-domain variants. folder_aliases
# folds the per-domain configs into the family.
tau-bench:
  display: Tau-Bench
  category: agentic
  benchmarks: [tau-bench, tau2-bench]
  folder_aliases:
    - tau-bench
    - tau-bench-2
    - tau-bench-2_airline
    - tau-bench-2_retail
    - tau-bench-2_telecom
    - tau-bench-2_banking

# CySE2 — three security sub-benchmarks under one suite.
cyse2:
  display: CySE2
  category: security
  folder_aliases:
    - cyse2
    - cyse2_interpreter_abuse
    - cyse2_prompt_injection
    - cyse2_vulnerability_exploit

# MMMU — multimodal-MMU. "MMMU-Multiple-Choice" and "MMMU-Open-Ended"
# are distinct answer-format benchmarks (siblings in the family), each
# its own canonical; folder_aliases routes their source_configs here.
mmmu:
  display: MMMU
  category: multimodal
  benchmarks: [mmmu, mmmu-multiple-choice, mmmu-open-ended, mmmu-pro]
  folder_aliases:
    - MMMU-Multiple-Choice
    - MMMU-Open-Ended

# MT-Bench — naming inconsistency in EEE (mt_bench vs mtbench).
mt-bench:
  display: MT-Bench
  category: other
  folder_aliases:
    - mt_bench
    - mtbench

# LiveBench — multi-task suite with 6 per-category buckets. Each bucket
# is its own canonical benchmark (siblings in the family); their further
# subsets are slices via parent_benchmark_id.
livebench:
  display: LiveBench
  category: general
  benchmarks:
    - livebench
    - livebench-coding
    - livebench-language
    - livebench-instruction-following
    - livebench-math
    - livebench-reasoning
    - livebench-data-analysis
  primary_benchmark_key: livebench

caparena:
  display: CapArena
  category: multimodal
  benchmarks: [caparena-auto]

agentharm:
  display: AgentHarm
  category: safety
  benchmarks: [agentharm]

math-mc:
  display: MATH-MC
  category: math
  benchmarks: [math-mc]

gsm-mc:
  display: GSM-MC
  category: math
  benchmarks: [gsm-mc]

swe-polybench-leaderboard:
  display: SWE-PolyBench
  category: code
  benchmarks: [swe-polybench, swe-polybench-verified]

multi-swe-bench-leaderboard:
  display: Multi-SWE-Bench
  category: code
  benchmarks: [multi-swe-bench-leaderboard]

hf-open-llm-v2:
  display: HF Open LLM v2
  category: general
  composite_keys: [hf-open-llm-v2]

aime:
  display: AIME family
  category: math
  benchmarks: [aime, aime-2024, aime-2025, aime-2026]

arc-agi:
  display: ARC-AGI family
  category: reasoning
  benchmarks: [arc-agi, arc-agi-2, arc-agi-3]

humaneval:
  display: HumanEval family
  category: code
  benchmarks:
    - humaneval
    - humaneval-v
    - humaneval-haskell
    - humaneval-decompile
    - humaneval-nfr
    - humanevalcomm
    - humanevalnext
    - mhumaneval
    - buggy-humaneval

evalplus:
  display: EvalPlus family
  category: code
  benchmarks: [evalplus, humaneval-plus, mbpp-plus]

# apex-swe is pre-registered with no data yet, so it has no composite_key.
apex:
  display: Mercor APEX
  category: agentic
  benchmarks: [apex-v1, apex-agents, apex-swe]
  composite_keys: [apex-v1, apex-agents]
  primary_benchmark_key: apex-v1

# --- lm-evaluation-harness task families (PR #64 follow-up) ---------------
# Suites whose parts are separately reported datasets. Members are
# standalone benchmarks (no parent_benchmark_id) so each keeps its own
# merged page; the suite root is the resolution target for suite-level
# scores. Same shape as `livebench`. Display names carry the " family"
# suffix like `mmlu`/`gpqa`: the frontend re-humanizes a display that
# slugifies to the key (family-table.tsx), which would render GLUE as
# "Glue". The producer picks the family headline by key == benchmark
# id (sidecars._mark_family_primary_benchmark); primary_benchmark_key
# is recorded for the registry API and future producer wiring.

glue:
  display: GLUE family
  category: general
  benchmarks: [glue, cola, mnli, mnli-mismatched, mrpc, qnli, qqp, rte, sst2, stsb, wnli]
  primary_benchmark_key: glue

superglue:
  display: SuperGLUE family
  category: general
  benchmarks: [superglue, boolq, cb, copa, multirc, record, wic, wsc]
  primary_benchmark_key: superglue

anli:
  display: ANLI family
  category: reasoning
  benchmarks: [anli, anli-r1, anli-r2, anli-r3]
  primary_benchmark_key: anli

head-qa:
  display: HEAD-QA family
  category: knowledge
  benchmarks: [head-qa, head-qa-es, head-qa-en]
  primary_benchmark_key: head-qa

lambada:
  display: LAMBADA family
  category: general
  benchmarks: [lambada, lambada-standard, lambada-openai]
  primary_benchmark_key: lambada

# NQ-Open is the open-domain subset of Natural Questions (scored
# closed-book by the harness); same shape as the gpqa family.
naturalquestions:
  display: Natural Questions family
  category: knowledge
  benchmarks: [naturalquestions, nq-open]
  primary_benchmark_key: naturalquestions

# LEXam's two published sub-tasks are separately reported datasets (own HF
# config, own n, own leaderboard table, own metric on its own scale), so they
# stay standalone benchmarks grouped here rather than `parent_benchmark_id`
# slices — same shape as the glue / lambada families above. The root `lexam`
# is the resolution target for any LEXam-level reference.
lexam:
  display: LEXam family
  category: reasoning
  benchmarks: [lexam, lexam-open-question, lexam-mcq-4-choices]
  primary_benchmark_key: lexam
